<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AR Fun — Iron Dragon Games</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#061427;color:#cfe8ff;font-family:Segoe UI,Roboto,system-ui,Arial;min-height:100%}
    body{padding:40px 20px 60px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .wrap{max-width:640px;margin:0 auto}
    .back{display:inline-block;margin-bottom:48px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#4a7a99;border:1px solid #0e2a45;border-radius:4px;padding:6px 14px;text-decoration:none}
    .back:hover{color:#6ef;border-color:#6ef}
    h1{margin:0 0 14px;font-size:clamp(32px,7vw,64px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#6ef;text-shadow:0 0 18px #6ef,0 0 48px #3af}
    .sub{margin:0 0 32px;font-size:clamp(13px,2.4vw,18px);letter-spacing:.28em;text-transform:uppercase;color:#4a7a99}
    p{max-width:520px;font-size:14px;line-height:1.8;color:#7aaabf;margin:0 0 28px}
    .mobile-note{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.04em;color:#4a7a99;background:rgba(102,238,255,.06);border:1px solid rgba(102,238,255,.25);border-radius:20px;padding:8px 16px;margin:0 0 28px}
    .play-btn{display:inline-block;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#061427;background:#6ef;border-radius:5px;padding:10px 28px;text-decoration:none;transition:background .14s,transform .1s,box-shadow .14s;box-shadow:0 0 14px rgba(102,238,255,.45)}
    .play-btn:hover{background:#fff;transform:scale(1.05);box-shadow:0 0 28px rgba(102,238,255,.8)}
    .play-btn:active{transform:scale(0.97)}
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← Back to Games</a>
    <h1>AR Fun</h1>
    <p class="sub">Augmented Reality Experiences</p>
    <p>Camera-based AR experiences from Iron Dragon Games, built with WebAR — no app download required. More series are in development.</p>
    <p class="mobile-note">📱 Best experienced on a mobile device with a rear camera</p>
    <a class="play-btn" href="bitforest/index.html">Enter Bitforest</a>
  </div>
</body>
</html>
